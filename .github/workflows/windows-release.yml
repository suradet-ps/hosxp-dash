name: 'Release Windows Installer'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Release artifacts must not be built from caches that lower-privilege
# workflows can write (cache poisoning) — keep every cache off here.
cache-mode: none

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
          no-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri Windows Installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'HOSxP Dash ${{ github.ref_name }}'
          releaseBody: 'ดาวน์โหลดไฟล์ตัวติดตั้ง .msi และ .exe สำหรับ Windows ได้ที่ Assets ด้านล่าง'
          releaseDraft: false
          prerelease: false
